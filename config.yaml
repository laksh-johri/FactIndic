# FactIndic central configuration. Model names / paths / hyper-parameters live here only.
seed: 42

data:
  articles: data/factindic_synth_articles.jsonl
  errors: data/factindic_synth_errors.jsonl

models:
  embedder: sentence-transformers/LaBSE
  nli: MoritzLaurer/mDeBERTa-v3-base-xnli-multilingual-nli-2mil7
  llm: gemini-2.5-flash          # change here if you want another Gemini model

llm:
  cache_path: cache/llm_cache.json
  log_path: results/llm_calls.csv
  max_retries: 5
  backoff_base_seconds: 2.0       # wait = base * 2**attempt (+ jitter)
  max_output_tokens: 1024

decomposition:
  method: clause                  # sentence | clause | gold (oracle) | llm (needs API key)

retrieval:
  top_k: 3
  # Selected on DEV (Step 3b, results/retrieval/dev_breakdown_20261124_021128): LaBSE vs
  # lexical+norm compared per language with the pre-registered rule; lexical+norm wins in BOTH
  # Hindi and Hinglish (decided by MRR, 1.000 vs 0.996). LaBSE and hybrid stay as baselines.
  method: lexical                 # lexical | labse | hybrid
  normalize: true                 # digits/nukta/case normalisation before scoring
  alpha: 0.5                      # hybrid weight on LaBSE (only used if method = hybrid)
  score_norm: minmax              # hybrid only: rescale both scorers to [0,1] per claim, then average

verification:
  nli_threshold: 0.5              # placeholder; tune on DEV only (Step 6)

paths:
  results: results
  cache: cache
